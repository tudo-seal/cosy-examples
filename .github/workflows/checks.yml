# The checks CONTRIBUTING lists, on every push and every pull request. The commands are the same
# ones, so a failure here names the same defect a failure on a laptop names. The environment is
# not the same: torch, torchvision, pandas, matplotlib, tqdm, pytest and hypothesis are declared
# without versions, and cosy comes from the default branch of its repository, so this job also
# fails when something outside this repository moves. That is the point of running it.
name: checks

on:
  push:
    branches: [develop, main]
  pull_request:
  # So that a branch can be checked before it is merged or opened as a pull request. Without this
  # the workflow cannot run on the branch that introduces it.
  workflow_dispatch:

permissions:
  contents: read

# A second push to a pull request cancels the run of the first one, which is otherwise still
# installing torch when its result no longer matters. On develop and main every commit keeps its
# own verdict, because there the run is the record of that commit and not of the branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Two jobs, because only one of them needs a matrix. mypy is configured for 3.11 in pyproject.toml
# and ruff reads its target from requires-python, so both checkers would examine the same thing
# twice. The tests are what differs between the interpreters, since every dependency resolves to a
# different build under each.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          # Named because the default is requirements.txt, and the dependencies live in
          # pyproject.toml.
          cache-dependency-path: pyproject.toml
      - name: Install torch without CUDA
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install
        run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy bayesian_optimization tests

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Both versions run to the end. A failure on one of them says something the other cannot,
      # since what differs between them is which build of every dependency gets installed.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # The CPU build, from the index that carries it. The default wheel of torch pulls the CUDA
      # runtime, which is gigabytes of download for a runner that has no GPU. Installing it first
      # means the editable install below finds both requirements already satisfied.
      - name: Install torch without CUDA
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      # cosy comes along as the declared git dependency, from the default branch of its repository.
      - name: Install
        run: pip install -e ".[dev]"

      # Without the slow marker, which is the five end-to-end runs of the loop. Several tests hold
      # a duration against a bound, so a run that fails on one of those is more likely to be a busy
      # runner than a change.
      - name: pytest
        run: pytest -m "not slow"
